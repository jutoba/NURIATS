<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reparto CATS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: hoja de trabajo tipo libro de horas — banda superior, pestañas, paneles apilados; cifras siempre en mono tabular */
:root{
  --bg:#f2f4f3; --surface:#ffffff; --surface-2:#f7f9f8; --ink:#16201c; --muted:#5a6964; --line:#d7dfdb; --line-strong:#b9c5c0;
  --accent:#0c6a56; --accent-ink:#ffffff; --accent-soft:#d9eee7;
  --ext:#2356b5; --ext-soft:#e2eafa; --int:#9a5d07; --int-soft:#faeed7; --promo:#6a58a8; --promo-soft:#ebe7f7;
  --weekend:#e9edeb; --hol:#f8dfd9; --hol-ink:#a0391f; --warn:#b3361e; --warn-soft:#fbe6e1; --ok:#1d7a49;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111715; --surface:#18201d; --surface-2:#1d2622; --ink:#e4ebe8; --muted:#97a6a0; --line:#2b3632; --line-strong:#3d4a45;
  --accent:#4fc2a4; --accent-ink:#0b1714; --accent-soft:#183a31;
  --ext:#8fb2f5; --ext-soft:#1c2a44; --int:#e3ad59; --int-soft:#3a2c14; --promo:#b8a8ee; --promo-soft:#2a2540;
  --weekend:#202a26; --hol:#3d2420; --hol-ink:#f2a08b; --warn:#f08a70; --warn-soft:#3b221c; --ok:#6fd39d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111715; --surface:#18201d; --surface-2:#1d2622; --ink:#e4ebe8; --muted:#97a6a0; --line:#2b3632; --line-strong:#3d4a45;
  --accent:#4fc2a4; --accent-ink:#0b1714; --accent-soft:#183a31;
  --ext:#8fb2f5; --ext-soft:#1c2a44; --int:#e3ad59; --int-soft:#3a2c14; --promo:#b8a8ee; --promo-soft:#2a2540;
  --weekend:#202a26; --hol:#3d2420; --hol-ink:#f2a08b; --warn:#f08a70; --warn-soft:#3b221c; --ok:#6fd39d; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{padding-block:18px 0;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:-.01em;margin:0;text-wrap:balance}
.brand p{margin:0;color:var(--muted);max-width:62ch}
nav.tabs{display:flex;gap:4px;overflow-x:auto}
nav.tabs button{font:600 13px var(--f-body);background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:10px 12px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs button:hover{color:var(--ink)}
main .wrap{padding-block:20px 48px;display:flex;flex-direction:column;gap:18px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h2{font-family:var(--f-display);font-weight:600;font-size:17px;margin:0}
.panel .sub{color:var(--muted);margin:0;font-size:13px;max-width:72ch}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:6px;padding:6px 8px}
input[type=number]{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
textarea{width:100%;min-height:140px;font-family:var(--f-mono);font-size:12px}
.btn{font:600 13px var(--f-body);border-radius:6px;padding:7px 12px;cursor:pointer;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink)}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted);padding:4px 8px}
.btn.ghost:hover{color:var(--warn)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:6px;overflow:hidden}
.seg button{font:600 12px var(--f-body);border:0;background:var(--surface);color:var(--muted);padding:7px 12px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line-strong)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink)}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.stat .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.stat .v{font-family:var(--f-mono);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums}
.stat .v.warn{color:var(--warn)}
.stat .v.ok{color:var(--ok)}
@media (max-width:720px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}

.scroll{overflow-x:auto;min-width:0;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;background:var(--surface-2);position:sticky;top:0}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
tr.sel td{background:var(--accent-soft)}
tfoot td{font-weight:600;background:var(--surface-2);border-top:1px solid var(--line-strong)}

.pill{display:inline-block;font:600 11px var(--f-body);padding:2px 8px;border-radius:999px;letter-spacing:.02em}
.pill.ext{background:var(--ext-soft);color:var(--ext)}
.pill.int{background:var(--int-soft);color:var(--int)}
.pill.promo{background:var(--promo-soft);color:var(--promo)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--accent-soft);color:var(--accent)}

.bar{height:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;overflow:hidden;min-width:90px}
.bar i{display:block;height:100%;background:var(--accent)}
.bar i.full{background:var(--warn)}

/* CATS grid */
table.cats td.d,table.cats th.d{text-align:center;font-family:var(--f-mono);font-variant-numeric:tabular-nums;min-width:44px;padding:6px 4px}
table.cats th.d{text-transform:none;letter-spacing:0}
table.cats th.d small{display:block;font-weight:500;font-size:10px}
table.cats .we{background:var(--weekend)}
table.cats .ho{background:var(--hol);color:var(--hol-ink)}
table.cats td.proj{position:sticky;left:0;background:var(--surface);z-index:1;min-width:150px;max-width:220px;white-space:normal}
table.cats th.proj{position:sticky;left:0;z-index:2}
table.cats td.proj b{display:block;font-weight:600}
table.cats td.proj code{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
table.cats tfoot td.proj{background:var(--surface-2)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block;border:1px solid var(--line)}

/* matrix edit */
table.edit td{padding:4px 6px}
table.edit input[type=text]{width:100%;min-width:120px}
table.edit input[type=number]{width:92px}
table.edit td.chk{text-align:center}
table.edit input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent)}
th.vert{white-space:normal;min-width:84px;max-width:110px;text-transform:none;letter-spacing:0;font-size:11px}

.note{font-size:12.5px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:10px 12px;max-width:80ch}
.note b{color:var(--ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;font-weight:600;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.warnlist{margin:0;padding-left:18px;color:var(--warn);font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.lbl{font-size:12px;color:var(--muted);font-weight:500}
.f{display:flex;flex-direction:column;gap:4px}
.pill{background:var(--surface-2);color:var(--muted)}
code.job{display:block;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.mono{font-family:var(--f-mono)}
.checks{display:flex;gap:6px;flex-wrap:wrap;align-self:flex-end}
td.acts{display:flex;gap:2px}
.btn.ghost.ok{color:var(--accent)}
input.cell{width:48px;padding:4px 2px;text-align:center;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:12.5px;border-color:transparent;background:transparent;border-radius:4px}
input.cell:hover{border-color:var(--line-strong)}
input.cell:focus{border-color:var(--accent);background:var(--surface)}
table.cats td.bad,td.n.bad{background:var(--warn-soft)!important;color:var(--warn)}
.legend i.badk{background:var(--warn-soft);border-color:var(--warn)}
.note.alert{border-color:var(--warn);background:var(--warn-soft)}
.note.alert b{color:var(--warn)}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:10px;max-width:80ch}
.steps li .btn{margin-left:6px;padding:4px 10px}
.steps li.done b{color:var(--ok)}
.emptybox{border:1px dashed var(--line-strong);border-radius:6px;padding:20px;text-align:center;color:var(--muted)}
.panel a{color:var(--accent)}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>Reparto CATS</h1>
      <p>Reparte las horas de cada quincena entre proyectos externos, internos y de promoción sin pasarse del tope de cada proyecto.</p>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="res" aria-selected="true">Reparto</button>
      <button role="tab" data-tab="team" aria-selected="false">Equipo</button>
      <button role="tab" data-tab="proj" aria-selected="false">Proyectos</button>
      <button role="tab" data-tab="cfg" aria-selected="false">Calendario y reglas</button>
      <button role="tab" data-tab="data" aria-selected="false">Guardar / cargar</button>
    </nav>
  </div>
</header>
<main><div class="wrap" id="view"></div></main>
<div class="toast" id="toast" role="status"></div>

<script>
const STORE='reparto-cats-v2';
const TYPES={ext:'Externo',int:'Interno',promo:'Promoción'};
const TYPE_ORDER={ext:0,int:1,promo:2};
const DOW=['DO','LU','MA','MI','JU','VI','SA'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const fmtH=n=>(Math.round(n*100)/100).toFixed(2);
const fmtE=n=>isFinite(n)?Math.round(n).toLocaleString('es-ES')+' €':'Sin tope';
const pad=n=>String(n).padStart(2,'0');
const EPS=0.005;

function blank(){
  const now=new Date();
  return {
    month:`${now.getFullYear()}-${pad(now.getMonth()+1)}`,
    settings:{hWeek:9,hFri:7,woffMode:'fee',order:'own',step:0.5,
      holidays:'2026-01-01, 2026-01-06, 2026-04-02, 2026-04-03, 2026-05-01, 2026-05-15, 2026-10-12, 2026-11-02, 2026-11-09, 2026-12-07, 2026-12-08, 2026-12-25'},
    projects:[],people:defaultTeam(),manual:{},teamSeeded:true
  };
}
// Equipo FY27 (categoría y fee 2027), sin proyectos asignados
function defaultTeam(){
  return [['Nuria','Socia',671],['Sergio','Senior Manager',395],['Jordi','Manager 1',336],['Marta','Manager 1',336],
    ['Jose Antonio','Exp. Senior 1',241],['Camila','Exp. Senior 1',241],['Paula','Senior 1',187],['Alfonso','Senior 1',187],
    ['Juan','Senior 1',187],['Bea Gonzalez','Senior 1',187],['Ana','Assistant 2',149],['Amaya','Assistant 2',149],
    ['David','Assistant 2',149],['Nacho','Assistant 2',149],['Bea Casado','Assistant 2',149],['Bea García','Manager',358],
    ['Adrian Ortega','Senior 1',187],['Victor Herrero','Assistant 1',126],['Alonso Vicente','Assistant 2',149],
    ['Chen Xin','Assistant 2',149],['David García Arribas','Assistant 2',149],['Juan Checa','Assistant 1',126],
    ['David García Rivera','Assistant 1',126],['Natalia Guillén','Assistant 1',126],['Lara','Assistant 1',126],
    ['Alberto Caballero Ferrero','Assistant 1',126],['Javier Guerrero','Assistant 1',126],['Elsa Mbasogo','Exp. Senior 1',241],
    ['Carlos Ballesteros','Exp. Senior 1',241],['María Beltran','Exp. Senior 2',252],['Miguel Angel Martinez','Senior Manager',395]]
    .map(([name,cat,fee])=>({id:uid(),name,cat,fee,absences:'',projects:[]}));
}
let S;
try{S=JSON.parse(localStorage.getItem(STORE))}catch(e){S=null}
if(!S||!Array.isArray(S.people))S=blank();
if(!S.manual)S.manual={};
if(!S.teamSeeded){if(!S.people.length)S.people=defaultTeam();S.teamSeeded=true}
function save(){try{localStorage.setItem(STORE,JSON.stringify(S))}catch(e){}}

let tab='res', half='1', selPerson=null;
const projById=id=>S.projects.find(p=>p.id===id);

/* ---------- fechas ---------- */
function expandDates(str){
  return String(str||'').split(/[\s,;]+/).filter(Boolean).flatMap(tok=>{
    const m=tok.split(':'); if(m.length!==2)return [tok];
    const a=new Date(m[0]+'T00:00'),b=new Date(m[1]+'T00:00'); if(isNaN(a)||isNaN(b))return [tok];
    const out=[];for(let d=new Date(a);d<=b;d.setDate(d.getDate()+1))out.push(`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`);return out;
  });
}
const parseDates=s=>new Set(expandDates(s));
function monthDays(){
  const [y,m]=S.month.split('-').map(Number);
  const n=new Date(y,m,0).getDate(); const hol=parseDates(S.settings.holidays); const out=[];
  for(let d=1;d<=n;d++){
    const dt=new Date(y,m-1,d), dow=dt.getDay(), iso=`${y}-${pad(m)}-${pad(d)}`;
    const we=dow===0||dow===6, ho=hol.has(iso);
    out.push({d,dow,iso,we,ho,h:(we||ho)?0:(dow===5?+S.settings.hFri:+S.settings.hWeek)});
  }
  return out;
}
const halves=days=>({'1':days.map((x,i)=>i).filter(i=>days[i].d<=15),'2':days.map((x,i)=>i).filter(i=>days[i].d>=16)});
function halfRange(days){const h=halves(days);return half==='m'?days.map((x,i)=>i):h[half]}
function monthLabel(){const [y,m]=S.month.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString('es-ES',{month:'long',year:'numeric'})}

/* ---------- motor de reparto ---------- */
function poolOf(p){
  if(p.cap===null||p.cap===''||p.cap===undefined||isNaN(+p.cap))return Infinity;
  const w=Math.min(Math.max(+p.woff||0,0),99)/100, cap=+p.cap;
  const pool=S.settings.woffMode==='fee'?cap/(1-w):cap*(1-w);
  return Math.max(pool-(+p.prev||0),0);
}
function manualOf(pid){return (S.manual[S.month]||{})[pid]}
function compute(){
  const days=monthDays(), step=+S.settings.step||0.5;
  const projs=S.projects, pool={}, used={};
  projs.forEach(p=>{pool[p.id]=poolOf(p);used[p.id]=0});
  const people=S.people.map(pe=>{
    const abs=parseDates(pe.absences);
    const cap=days.map(x=>abs.has(x.iso)?0:x.h);
    const total=cap.reduce((a,b)=>a+b,0);
    return {pe,cap,R:total,total,alloc:{},grid:{},manual:false};
  });
  // 1) hojas editadas a mano: se respetan tal cual y consumen presupuesto primero
  for(const P of people){
    const man=manualOf(P.pe.id); if(!man)continue;
    P.manual=true; P.R=0;
    for(const id in man){
      if(!projById(id))continue;
      const row=days.map((x,i)=>+man[id][i]||0);
      P.grid[id]=row; const h=row.reduce((a,b)=>a+b,0);
      P.alloc[id]=h; used[id]+=h*(+P.pe.fee||0); pool[id]-=h*(+P.pe.fee||0);
    }
  }
  // 2) reparto automático para el resto
  const tiers=S.settings.order==='own'
    ?[['own','ext'],['own','int'],['own','promo'],['other','ext'],['other','int'],['other','promo']]
    :[['own','ext'],['other','ext'],['own','int'],['other','int'],['own','promo'],['other','promo']];
  for(const [who,type] of tiers){
    let progress=true;
    while(progress){
      progress=false;
      for(const P of people){
        if(P.manual||P.R<=1e-9)continue;
        const fee=+P.pe.fee||0, give=Math.min(step,P.R);
        let best=null,bestScore=-Infinity;
        for(const pr of projs){
          if(pr.type!==type)continue;
          const own=P.pe.projects.includes(pr.id);
          if((who==='own')!==own)continue;
          if(pool[pr.id]+1e-6<give*fee)continue;
          const score=(pool[pr.id]===Infinity?1e15:pool[pr.id])-(P.alloc[pr.id]||0)*1e-3;
          if(score>bestScore){bestScore=score;best=pr}
        }
        if(!best)continue;
        P.alloc[best.id]=(P.alloc[best.id]||0)+give;
        P.R-=give; pool[best.id]-=give*fee; used[best.id]+=give*fee;
        progress=true;
      }
    }
  }
  // 3) reparto por días de las hojas automáticas: externo → interno → promoción
  for(const P of people){
    if(P.manual)continue;
    const left=P.cap.slice();
    const ids=Object.keys(P.alloc).sort((a,b)=>TYPE_ORDER[projById(a).type]-TYPE_ORDER[projById(b).type]);
    for(const id of ids){
      let rem=P.alloc[id]; const row=new Array(days.length).fill(0);
      for(let i=0;i<days.length&&rem>1e-9;i++){
        const t=Math.min(left[i],rem); if(t<=0)continue;
        row[i]+=t; left[i]-=t; rem-=t;
      }
      P.grid[id]=row;
    }
  }
  // 4) control quincenal contra horas estándar
  const H=halves(days);
  for(const P of people){
    P.check={};
    for(const k of ['1','2']){
      const std=H[k].reduce((a,i)=>a+P.cap[i],0);
      const asg=H[k].reduce((a,i)=>a+Object.values(P.grid).reduce((b,row)=>b+row[i],0),0);
      const badDays=H[k].filter(i=>Math.abs(Object.values(P.grid).reduce((b,row)=>b+row[i],0)-P.cap[i])>EPS).length;
      P.check[k]={std,asg,diff:asg-std,badDays};
    }
  }
  return {days,people,pool,used};
}

/* ---------- utilidades de interfaz ---------- */
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),1900)}
function copyText(txt,ok){
  const fallback=()=>{const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');toast(ok)}catch(e){toast('No se pudo copiar: selecciona y copia a mano')}ta.remove()};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(()=>toast(ok),fallback);else fallback();
}
function checkPill(c,label){
  if(c.std===0&&c.asg===0)return `<span class="pill">${label}: sin horas</span>`;
  if(Math.abs(c.diff)<=EPS)return `<span class="pill ok">${label}: ${fmtH(c.asg)} / ${fmtH(c.std)} h</span>`;
  return c.diff>0
    ?`<span class="pill warn">${label}: te pasas ${fmtH(c.diff)} h</span>`
    :`<span class="pill warn">${label}: te faltan ${fmtH(-c.diff)} h</span>`;
}
const isOk=P=>['1','2'].every(k=>Math.abs(P.check[k].diff)<=EPS&&P.check[k].badDays===0);

function emptyState(){

  return `<section class="panel empty">

    <ol class="steps">

      <li class="${nt?'done':''}"><b>Equipo</b>: nombre, categoría, fee y en qué proyectos está cada uno. ${nt?`${nt} persona${nt>1?'s':''}.`:''} <button class="btn" data-goto="team">Ir a Equipo</button></li>
      <li><b>Calendario</b>: revisa festivos y horas por día (ya vienen los de Madrid 2026). <button class="btn" data-goto="cfg">Revisar</button></li>

  </section>`;
}

/* ---------- vista Reparto ---------- */
function viewRes(){
  if(!S.people.length||!S.projects.length)return emptyState();
  const R=compute(); const idx=halfRange(R.days);
  const sum=arr=>idx.reduce((a,i)=>a+(arr[i]||0),0);
  let tot=0,ext=0;
  const rows=R.people.map(P=>{
    const t={ext:0,int:0,promo:0};
    for(const id in P.grid){const pr=projById(id);if(pr)t[pr.type]+=sum(P.grid[id])}
    tot+=t.ext+t.int+t.promo; ext+=t.ext;
    return {P,t,cap:sum(P.cap)};
  });
  if(!selPerson||!S.people.find(p=>p.id===selPerson))selPerson=S.people[0].id;
  const sel=R.people.find(P=>P.pe.id===selPerson);
  const wrong=R.people.filter(P=>!isOk(P));
  const over=S.projects.filter(p=>R.pool[p.id]<-1);
  const noPromo=!S.projects.some(p=>p.type==='promo'&&!isFinite(poolOf(p)));

  return `
  <section class="panel">
    <div class="row">
      <label class="f">Mes<input type="month" id="month" value="${esc(S.month)}"></label>
      <div class="f"><span class="lbl">Periodo</span>
        <div class="seg" role="group" aria-label="Periodo">
          <button data-half="1" aria-pressed="${half==='1'}">1–15</button>
          <button data-half="2" aria-pressed="${half==='2'}">16–${R.days.length}</button>
          <button data-half="m" aria-pressed="${half==='m'}">Mes entero</button>
        </div>
      </div>
      <span class="spacer"></span>
      <button class="btn" id="copyTeam">Copiar resumen del equipo</button>
    </div>
    <p class="sub">El tope de los proyectos es mensual, así que se reparte el mes completo de ${esc(monthLabel())} y aquí ves el periodo elegido.</p>
  </section>

  <div class="stats">
    <div class="stat"><span class="k">Horas a cargar</span><span class="v">${fmtH(tot)}</span></div>
    <div class="stat"><span class="k">En externos</span><span class="v">${tot?Math.round(ext/tot*100):0}%</span></div>
    <div class="stat"><span class="k">Hojas que no cuadran</span><span class="v ${wrong.length?'warn':'ok'}">${wrong.length} / ${R.people.length}</span></div>
    <div class="stat"><span class="k">Proyectos pasados de tope</span><span class="v ${over.length?'warn':'ok'}">${over.length}</span></div>
  </div>
  ${wrong.length?`<div class="note alert"><b>${wrong.length===1?'Una hoja no cuadra':wrong.length+' hojas no cuadran'} con las horas estándar.</b> ${wrong.slice(0,6).map(P=>esc(P.pe.name)).join(', ')}${wrong.length>6?'…':''}. ${R.people.some(P=>!P.manual&&!isOk(P))&&noPromo?'Las automáticas no llegan porque se acaba el presupuesto: añade un proyecto de promoción sin tope para que absorba el resto.':'Revisa las marcadas en la tabla del equipo.'}</div>`:''}
  ${over.length?`<div class="note alert"><b>Te pasas del tope en ${over.map(p=>esc(p.name)).join(', ')}.</b> Pasa porque hay hojas editadas a mano que cargan más de lo que queda; baja horas ahí o sube el tope.</div>`:''}

  <section class="panel">
    <div class="row"><h2>Hoja de ${esc(sel.pe.name)}</h2>${sel.manual?'<span class="pill promo">Editada a mano</span>':'<span class="pill">Automática</span>'}</div>
    ${catsGrid(R,sel,idx)}
  </section>

  <section class="panel">
    <h2>Equipo</h2>
    <p class="sub">Pulsa una fila para ver y editar su hoja.</p>
    <div class="scroll"><table>
      <thead><tr><th>Persona</th><th>Categoría</th><th class="n">Estándar</th><th class="n">Externo</th><th class="n">Interno</th><th class="n">Promoción</th><th>1ª quincena</th><th>2ª quincena</th></tr></thead>
      <tbody>${rows.map(r=>`<tr class="click ${r.P.pe.id===selPerson?'sel':''}" data-person="${r.P.pe.id}" tabindex="0">
        <td>${esc(r.P.pe.name)}${r.P.manual?' <span class="pill promo">a mano</span>':''}</td><td>${esc(r.P.pe.cat)}</td><td class="n">${fmtH(r.cap)}</td>
        <td class="n">${fmtH(r.t.ext)}</td><td class="n">${fmtH(r.t.int)}</td><td class="n">${fmtH(r.t.promo)}</td>
        <td>${checkPill(r.P.check['1'],'1ª')}</td><td>${checkPill(r.P.check['2'],'2ª')}</td></tr>`).join('')}</tbody>
    </table></div>
  </section>

  <section class="panel">
    <h2>Consumo de proyectos en el mes</h2>
    <div class="scroll"><table>
      <thead><tr><th>Proyecto</th><th>Tipo</th><th class="n">Tope</th><th class="n">WOFF</th><th class="n">Disponible</th><th class="n">Usado</th><th class="n">Horas</th><th>Uso</th></tr></thead>
      <tbody>${S.projects.map(p=>{
        const pool=poolOf(p), u=R.used[p.id], hrs=R.people.reduce((a,P)=>a+(P.alloc[p.id]||0),0);
        const pct=isFinite(pool)&&pool>0?Math.min(u/pool*100,100):(u>0?100:0);
        const isOver=R.pool[p.id]<-1;
        return `<tr><td><b>${esc(p.name)}</b><br><code class="job">${esc(p.code)}</code></td>
        <td><span class="pill ${p.type}">${TYPES[p.type]}</span></td>
        <td class="n">${isFinite(pool)?fmtE(+p.cap):'Sin tope'}</td><td class="n">${isFinite(pool)?(+p.woff||0)+'%':'—'}</td>
        <td class="n">${fmtE(pool)}</td><td class="n">${Math.round(u).toLocaleString('es-ES')} €</td><td class="n">${fmtH(hrs)}</td>
        <td>${isFinite(pool)?`<div class="row" style="gap:6px;flex-wrap:nowrap"><div class="bar"><i class="${pct>98?'full':''}" style="width:${pct}%"></i></div>${isOver?`<span class="pill warn">+${fmtE(-R.pool[p.id])}</span>`:''}</div>`:'<span class="pill promo">Absorbe el resto</span>'}</td></tr>`}).join('')}</tbody>
    </table></div>
  </section>`;
}

function catsGrid(R,P,idx){
  const ids=Object.keys(P.grid).filter(id=>projById(id))
    .filter(id=>P.manual||idx.some(i=>P.grid[id][i]>0))
    .sort((a,b)=>TYPE_ORDER[projById(a).type]-TYPE_ORDER[projById(b).type]);
  const cls=i=>R.days[i].we?'we':(R.days[i].ho?'ho':'');
  const dayTot=i=>ids.reduce((a,id)=>a+P.grid[id][i],0);
  const head=idx.map(i=>`<th class="d ${cls(i)}">${DOW[R.days[i].dow]}<small>${R.days[i].d}</small></th>`).join('');
  const body=ids.map(id=>{
    const pr=projById(id), row=P.grid[id], t=idx.reduce((a,i)=>a+row[i],0);
    return `<tr><td class="proj"><b>${esc(pr.name)}</b><code class="job">${esc(pr.code)}</code> <span class="pill ${pr.type}">${TYPES[pr.type]}</span></td>
      ${idx.map(i=>{const off=R.days[i].we||R.days[i].ho;
        return `<td class="d ${cls(i)}">${off&&!row[i]?'':`<input class="cell" type="text" inputmode="decimal" id="c-${P.pe.id}-${id}-${i}" data-cell="${id}" data-day="${i}" value="${row[i]?fmtH(row[i]):''}" aria-label="${esc(pr.name)} día ${R.days[i].d}">`}</td>`}).join('')}
      <td class="n"><b>${fmtH(t)}</b></td>
      <td class="acts"><button class="btn ghost ok" data-copyrow="${id}">Copiar</button>${P.manual?`<button class="btn ghost" data-delrow="${id}" aria-label="Quitar fila ${esc(pr.name)}">Quitar</button>`:''}</td></tr>`;
  }).join('');
  const totRow=idx.map(i=>{const s=dayTot(i),bad=Math.abs(s-P.cap[i])>EPS;
    return `<td class="d ${cls(i)} ${bad?'bad':''}" ${bad?`title="${s>P.cap[i]?'Te pasas':'Te faltan'} ${fmtH(Math.abs(s-P.cap[i]))} h"`:''}>${s?fmtH(s):''}</td>`}).join('');
  const stdRow=idx.map(i=>`<td class="d ${cls(i)}">${fmtH(P.cap[i])}</td>`).join('');
  const tAll=idx.reduce((a,i)=>a+dayTot(i),0), tStd=idx.reduce((a,i)=>a+P.cap[i],0);
  const free=S.projects.filter(p=>!ids.includes(p.id));
  const halvesShown=half==='m'?['1','2']:[half];
  return `<div class="row">
      <label class="f">Persona<select id="personSel">${S.people.map(p=>`<option value="${p.id}" ${p.id===selPerson?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label>
      <div class="checks">${halvesShown.map(k=>checkPill(P.check[k],k==='1'?'1ª quincena':'2ª quincena')).join(' ')}</div>
      <span class="spacer"></span>
      ${P.manual?'<button class="btn" id="resetManual">Volver al reparto automático</button>':''}
      <button class="btn primary" id="copyPerson">Copiar hoja</button>
    </div>
    <div class="scroll" id="catsScroll"><table class="cats">
      <thead><tr><th class="proj">Narrative / Job</th>${head}<th class="n">Total</th><th></th></tr></thead>
      <tbody>${body||`<tr><td class="proj" colspan="${idx.length+3}">Sin horas en este periodo.</td></tr>`}</tbody>
      <tfoot><tr><td class="proj">Total</td>${totRow}<td class="n ${Math.abs(tAll-tStd)>EPS?'bad':''}">${fmtH(tAll)}</td><td></td></tr>
      <tr><td class="proj">Horas estándar</td>${stdRow}<td class="n">${fmtH(tStd)}</td><td></td></tr></tfoot>
    </table></div>
    <div class="row">
      ${free.length?`<label class="f">Añadir proyecto a la hoja<select id="addRowSel">${free.map(p=>`<option value="${p.id}">${esc(p.name)} · ${TYPES[p.type]}</option>`).join('')}</select></label><button class="btn" id="addRow" style="align-self:flex-end">Añadir fila</button>`:''}
      <span class="spacer"></span>
      <div class="legend"><span><i style="background:var(--weekend)"></i>Fin de semana</span><span><i style="background:var(--hol)"></i>Festivo</span><span><i class="badk"></i>El día no suma sus horas estándar</span></div>
    </div>
    <p class="sub">Escribe en cualquier casilla para ajustar la hoja; al editarla deja de recalcularse sola y su gasto se descuenta primero del tope del proyecto. “Copiar” deja las horas de los días laborables separadas por tabuladores.</p>`;
}

/* ---------- render y eventos ---------- */
function render(){
  const act=document.activeElement&&document.activeElement.id;
  const sc=document.getElementById('catsScroll'); const sl=sc?sc.scrollLeft:0;
  document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab));
  document.getElementById('view').innerHTML=({res:viewRes,team:viewTeam,proj:viewProj,cfg:viewCfg,data:viewData})[tab]();
  const sc2=document.getElementById('catsScroll'); if(sc2)sc2.scrollLeft=sl;
  if(act){const el=document.getElementById(act); if(el){el.focus(); if(el.select&&el.classList.contains('cell'))el.select()}}
}
function dirty(){save()}
function ensureManual(){
  // convierte la hoja actual en manual partiendo de lo calculado
  if(manualOf(selPerson))return manualOf(selPerson);
  const R=compute(), P=R.people.find(x=>x.pe.id===selPerson);
  const snap={}; for(const id in P.grid)snap[id]=P.grid[id].slice();
  (S.manual[S.month]=S.manual[S.month]||{})[selPerson]=snap;
  return snap;
}

document.querySelector('nav.tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;tab=b.dataset.tab;render()});
const view=document.getElementById('view');

view.addEventListener('keydown',e=>{
  const tr=e.target.closest('tr[data-person]');
  if(tr&&e.target===tr&&(e.key==='Enter'||e.key===' ')){e.preventDefault();selPerson=tr.dataset.person;render()}
  if(e.target.classList.contains('cell')&&e.key==='Enter'){e.preventDefault();e.target.blur()}
});

view.addEventListener('click',e=>{
  const t=e.target;
  const go=t.closest('[data-goto]'); if(go){e.preventDefault();tab=go.dataset.goto;render();return}
  const hb=t.closest('[data-half]'); if(hb){half=hb.dataset.half;render();return}
  const tr=t.closest('tr[data-person]'); if(tr){selPerson=tr.dataset.person;render();document.querySelector('.cats')?.scrollIntoView({behavior:'smooth',block:'center'});return}
  if(t.id==='addPerson'){const id=uid();S.people.push({id,name:'',cat:'',fee:0,absences:'',projects:[]});dirty();render();document.getElementById('pn-'+id)?.focus();return}
  if(t.dataset.delperson){S.people=S.people.filter(p=>p.id!==t.dataset.delperson);dirty();render();toast('Persona quitada');return}
  if(t.id==='addProj'){const id=uid();S.projects.push({id,name:'',code:'',desc:'',type:'ext',cap:0,woff:0,prev:0});dirty();render();document.getElementById('jn-'+id)?.focus();return}
  if(t.dataset.delproj){const id=t.dataset.delproj;S.projects=S.projects.filter(p=>p.id!==id);S.people.forEach(p=>p.projects=p.projects.filter(x=>x!==id));dirty();render();toast('Proyecto quitado');return}
  if(t.id==='resetManual'){delete (S.manual[S.month]||{})[selPerson];dirty();render();toast('Hoja recalculada automáticamente');return}
  if(t.id==='addRow'){const id=document.getElementById('addRowSel').value;const m=ensureManual();const n=monthDays().length;if(!m[id])m[id]=new Array(n).fill(0);dirty();render();return}
  if(t.dataset.delrow){const m=ensureManual();delete m[t.dataset.delrow];dirty();render();return}
  if(t.dataset.copyrow||t.id==='copyPerson'||t.id==='copyTeam'){
    const R=compute(), idx=halfRange(R.days);
    if(t.id==='copyTeam'){
      const lines=['Persona\tNarrative\tJob\tHoras'];
      R.people.forEach(Q=>{for(const id in Q.grid){const pr=projById(id);if(!pr)continue;const h=idx.reduce((a,i)=>a+Q.grid[id][i],0);if(h>0)lines.push([Q.pe.name,pr.name,pr.code,String(h).replace('.',',')].join('\t'))}});
      copyText(lines.join('\n'),'Resumen copiado: pégalo en Excel');return;
    }
    const P=R.people.find(x=>x.pe.id===selPerson);
    const work=idx.filter(i=>!R.days[i].we);
    const line=id=>work.map(i=>P.grid[id][i]?String(P.grid[id][i]).replace('.',','):'').join('\t');
    if(t.dataset.copyrow){copyText(line(t.dataset.copyrow),'Fila copiada (días laborables)');return}
    const ids=Object.keys(P.grid).filter(id=>projById(id)&&idx.some(i=>P.grid[id][i]>0));
    const hdr=['Narrative','Job'].concat(work.map(i=>DOW[R.days[i].dow]+' '+R.days[i].d)).join('\t');
    copyText([hdr,...ids.map(id=>{const pr=projById(id);return pr.name+'\t'+pr.code+'\t'+line(id)})].join('\n'),'Hoja copiada');return;
  }
  if(t.id==='copyJson'){copyText(document.getElementById('json').value,'Configuración copiada');return}
  if(t.id==='loadJson'){
    try{const d=JSON.parse(document.getElementById('json').value);if(!Array.isArray(d.people)||!Array.isArray(d.projects))throw 0;S=d;if(!S.manual)S.manual={};save();toast('Configuración cargada');tab='res';render()}
    catch(err){toast('El texto no es una configuración válida')}
    return;
  }
  if(t.id==='resetBtn'){
    const m=document.getElementById('resetMsg');
    if(t.dataset.armed){S=blank();save();tab='res';render();toast('Configuración reiniciada');return}
    t.dataset.armed='1';t.textContent='Pulsa otra vez para borrar';m.hidden=false;m.textContent='Se borrarán proyectos, asignaciones y hojas editadas; el equipo vuelve a la lista inicial.';return;
  }
});

view.addEventListener('change',e=>{
  const t=e.target;
  if(t.classList.contains('cell')){
    const raw=t.value.trim().replace(',','.'), v=raw===''?0:Number(raw);
    if(!isFinite(v)||v<0||v>24){toast('Escribe un número de horas entre 0 y 24');t.value='';return}
    const m=ensureManual(), id=t.dataset.cell, i=+t.dataset.day;
    if(!m[id])m[id]=new Array(monthDays().length).fill(0);
    m[id][i]=Math.round(v*100)/100;
    dirty();render();return;
  }
  if(t.id==='month'){if(t.value){S.month=t.value;save();render()}return}
  if(t.id==='personSel'){selPerson=t.value;render();return}
  const pr=t.closest('tr[data-pid]');
  if(pr){const pe=S.people.find(p=>p.id===pr.dataset.pid);
    if(t.dataset.asg){const id=t.dataset.asg;pe.projects=t.checked?[...new Set([...pe.projects,id])]:pe.projects.filter(x=>x!==id)}
    else if(t.dataset.f==='fee')pe.fee=+t.value||0; else pe[t.dataset.f]=t.value;
    dirty();return}
  const jr=t.closest('tr[data-prid]');
  if(jr){const p=S.projects.find(x=>x.id===jr.dataset.prid), f=t.dataset.f;
    if(f==='cap')p.cap=t.value===''?null:+t.value; else if(f==='woff'||f==='prev')p[f]=+t.value||0; else p[f]=t.value;
    dirty(); if(['cap','woff','prev','type'].includes(f))render(); return}
  const s=S.settings;
  if(t.id==='hWeek')s.hWeek=+t.value||0;
  else if(t.id==='hFri')s.hFri=+t.value||0;
  else if(t.id==='step')s.step=+t.value;
  else if(t.id==='holidays')s.holidays=t.value;
  else if(t.id==='woffMode')s.woffMode=t.value;
  else if(t.id==='order')s.order=t.value;
  else return;
  dirty();
});

render();
</script>
</body>
</html>
